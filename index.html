<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Study organizer: class schedule, calendar, notes and grade averages.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StudyFlow">
<title>StudyFlow</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<link rel="modulepreload" href="js/app.js">
<link rel="modulepreload" href="js/util.js">
<link rel="modulepreload" href="js/ui.js">
<link rel="modulepreload" href="js/editors.js">
<link rel="modulepreload" href="js/store.js">
<link rel="modulepreload" href="js/i18n.js">
<link rel="modulepreload" href="js/icons.js">
<link rel="modulepreload" href="js/theme.js">
<link rel="modulepreload" href="js/settings.js">
<link rel="modulepreload" href="js/pwa.js">
<link rel="modulepreload" href="js/views/dashboard.js">
<link rel="modulepreload" href="js/views/schedule.js">
<link rel="modulepreload" href="js/views/calendar.js">
<link rel="modulepreload" href="js/views/notes.js">
<link rel="modulepreload" href="js/views/subjects.js">
<script>
  // Aplica o tema antes da primeira pintura (evita piscar)
  try {
    document.documentElement.dataset.theme = localStorage.getItem('studyflow-theme') ||
      (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  } catch (e) {}
</script>
</head>
<body>
<aside id="nav">
  <div class="brand"><span class="logo"><i data-icon="book"></i></span><h1>StudyFlow</h1></div>
  <nav data-i18n-attr="aria-label:nav.main">
    <button data-view="dashboard"><i data-icon="home"></i><span data-i18n="nav.home">Home</span></button>
    <button data-view="schedule"><i data-icon="clock"></i><span data-i18n="nav.schedule">Schedule</span></button>
    <button data-view="calendar"><i data-icon="calendar"></i><span data-i18n="nav.calendar">Calendar</span></button>
    <button data-view="notes"><i data-icon="notes"></i><span data-i18n="nav.notes">Notes</span></button>
    <button data-view="subjects"><i data-icon="cap"></i><span data-i18n="nav.subjects">Subjects</span></button>
  </nav>
  <div id="userBox"></div>
</aside>
<main>
  <header>
    <h2 id="title"></h2>
    <button id="installBtn" hidden data-i18n-attr="title:install,aria-label:install"><i data-icon="download"></i><span data-i18n="install">Install app</span></button>
    <button id="setBtn" class="ghost" data-i18n-attr="title:settings,aria-label:settings"><i data-icon="settings"></i></button>
  </header>
  <section id="view"></section>
</main>
<dialog id="dlg"><form id="dlgForm"></form></dialog>
<noscript>StudyFlow needs JavaScript to work.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
