<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Organizador de estudos: horário de aulas, calendário, anotações e média por matéria.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StudyFlow">
<title>StudyFlow</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<script>
  // Aplica o tema antes da primeira pintura (evita piscar)
  try {
    document.documentElement.dataset.theme = localStorage.getItem('studyflow-theme') ||
      (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  } catch (e) {}
</script>
</head>
<body>
<aside id="nav">
  <div class="brand"><span class="logo"><i data-icon="book"></i></span><h1>StudyFlow</h1></div>
  <nav aria-label="Principal">
    <button data-view="dashboard"><i data-icon="home"></i><span>Início</span></button>
    <button data-view="schedule"><i data-icon="clock"></i><span>Horário</span></button>
    <button data-view="calendar"><i data-icon="calendar"></i><span>Calendário</span></button>
    <button data-view="notes"><i data-icon="notes"></i><span>Notas</span></button>
    <button data-view="subjects"><i data-icon="cap"></i><span>Matérias</span></button>
  </nav>
  <div id="userBox"></div>
</aside>
<main>
  <header>
    <h2 id="title"></h2>
    <button id="installBtn" hidden><i data-icon="download"></i><span>Instalar app</span></button>
    <button id="themeBtn" class="ghost" title="Alternar tema" aria-label="Alternar tema"></button>
  </header>
  <section id="view"></section>
</main>
<dialog id="dlg"><form id="dlgForm"></form></dialog>
<noscript>O StudyFlow precisa de JavaScript para funcionar.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
